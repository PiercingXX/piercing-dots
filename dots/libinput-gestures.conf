# Libinput-gestures configuration file
# Converted from hyprland config

# 3-finger horizontal swipe to switch workspaces
gesture swipe left 3 /bin/sh -lc 'herbstclient use_index +1 --skip-visible || wmctrl -s +1'
gesture swipe right 3 /bin/sh -lc 'herbstclient use_index -1 --skip-visible || wmctrl -s -1'

# 3-finger swipe up to launch app launcher
gesture swipe up 3 /bin/sh -lc "$HOME/.scripts/Control-Scripts/wm-app-launcher.sh"

# 4-finger swipe down to close window
gesture swipe down 4 wmctrl -c :ACTIVE:
