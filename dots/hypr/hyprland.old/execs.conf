# Synology Drive
exec-once = ~/.config/hypr/hyprland/scripts/SynoDrive.sh

# Bar, wallpaper
exec-once = hyprpaper
# Night light; timed profiles live in ~/.config/hypr/hyprsunset.conf
exec-once = bash -lc 'command -v hyprsunset >/dev/null && { pgrep -x hyprsunset >/dev/null || exec hyprsunset; }'
exec-once = waybar & nm-applet
exec-once = xdg-user-dirs-update

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = bash -lc 'for p in \
	/usr/lib/polkit-kde-authentication-agent-1 \
	/usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1 \
	/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 \
	/usr/libexec/polkit-gnome-authentication-agent-1 \
	/usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1; do \
	[ -x "$p" ] && exec "$p"; \
done'
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = bash -c 'sleep 1; vars="WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE"; if [ -d /run/systemd/system ]; then dbus-update-activation-environment --systemd $vars; else dbus-update-activation-environment $vars; fi'

# Notifications + status daemons (same set as the Lua config)
exec-once = bash -c 'pgrep -x swaync >/dev/null || { command -v swaync >/dev/null && exec swaync; } || { command -v dunst >/dev/null && exec dunst; }'
exec-once = bash ~/.scripts/Control-Scripts/battery-notify.sh
exec-once = bash ~/.scripts/Control-Scripts/workspace-notify.sh
exec-once = bash ~/.scripts/Control-Scripts/network-notify.sh
exec-once = bash ~/.scripts/Control-Scripts/bluetooth-notify.sh
exec-once = bash -c 'command -v hyprpm >/dev/null && hyprpm reload'

# Audio
exec-once = easyeffects --gapplication-service

# Clipboard: history (single watcher)
exec-once = bash ~/.scripts/Control-Scripts/wm-clipboard-daemon.sh

# Cursor
exec-once = hyprctl setcursor Black-Minimalistic 22

# Docker
exec-once = bash -lc 'systemctl --user list-unit-files 2>/dev/null | grep -q "^docker-desktop.service" && systemctl --user start docker-desktop'
