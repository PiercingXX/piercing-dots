# Synology Drive
exec-once = ~/.config/hypr/hyprland/scripts/SynoDrive.sh

# Bar, wallpaper
exec-once = hyprpaper
exec-once = waybar & nm-applet
exec-once = xdg-user-dirs-update

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = bash -lc 'for p in \
	/usr/lib/polkit-kde-authentication-agent-1 \
	/usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1 \
	/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 \
	/usr/libexec/polkit-gnome-authentication-agent-1 \
	/usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1; do \
	[ -x "$p" ] && exec "$p"; \
done'
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpm reload

# Audio
exec-once = easyeffects --gapplication-service

# Clipboard: history (single watcher)
exec-once = wl-paste --watch cliphist store

# Cursor
exec-once = hyprctl setcursor Black-Minimalistic 22

# Docker
exec-once = bash -lc 'systemctl --user list-unit-files 2>/dev/null | grep -q "^docker-desktop.service" && systemctl --user start docker-desktop'
