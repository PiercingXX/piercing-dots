##############################
### WINDOWS AND WORKSPACES ###
##############################

# Workspace Binding.
workspace = 1,monitor:DP-1
workspace = 2,monitor:DP-1
workspace = 3,monitor:DP-1
workspace = 4,monitor:DP-2
workspace = 5,monitor:DP-2
workspace = 6
workspace = 7
workspace = 8
workspace = 9
workspace = 10

# Window Rules - using new block syntax
windowrule {
    name = gnome-calculator
    match:class = org.gnome.Calculator
    float = yes
    center = yes
}

windowrule {
    name = pavucontrol
    match:class = pavucontrol
    float = yes
}

windowrule {
    name = blueman-manager
    match:class = blueman-manager
    float = yes
}

windowrule {
    name = gnome-settings
    match:class = org.gnome.Settings
    float = yes
}

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = steam
    match:class = com.valvesoftware.Steam
    float = yes
    center = yes
    size = 1000 600
}

windowrule {
    name = steam-windows
    match:title = Steam
    float = yes
    size = 1000 600
}

windowrule {
    name = steamwebhelper
    match:class = steamwebhelper
    float = yes
    size = 1000 600
}

# Picture-in-Picture
windowrule {
    name = pip
    match:title = Picture(-| )in(-| )[Pp]icture
    float = yes
    pin = yes
    size = 25%
    move = 73% 72%
}

# File Dialogs
windowrule {
    name = file-dialogs
    match:title = (Open File|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload)(.*)
    float = yes
}

# Tearing
windowrule {
    name = steam-app-tearing
    match:class = steam_app
    immediate = yes
}

# No shadow for tiled windows
windowrule {
    name = no-shadow-tiled
    match:float = false
    no_shadow = yes
}



