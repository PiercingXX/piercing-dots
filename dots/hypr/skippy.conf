# Skippy desk seat — toast pin + autostart.
# skippy-remote install.sh may rewrite this with an absolute binary path.
exec-once = ~/.scripts/Control-Scripts/skippy-desk.sh autostart

layerrule = noanim, skippy-toast

windowrule = float, title:^(skippy-toast)$
windowrule = pin, title:^(skippy-toast)$
windowrule = noborder, title:^(skippy-toast)$
windowrule = noshadow, title:^(skippy-toast)$
windowrule = rounding 0, title:^(skippy-toast)$
windowrule = move 100%-372 40, title:^(skippy-toast)$
