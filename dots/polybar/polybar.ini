[colors]
background = #1e1e1e
background-alt = #2a2a2a
foreground = #f0f0f0
primary = #327bd1
alert = #ff6767

[bar/main]
width = 100%
height = 32
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
modules-left = xworkspaces xwindow
modules-center = date
modules-right = pulseaudio bluetooth battery powermenu
tray-position = right
tray-padding = 2
wm-restack = generic
override-redirect = false

[module/xworkspaces]
type = custom/script
exec = $HOME/.config/polybar/polybar-workspaces.sh
interval = 1
click-left = herbstclient use %name%

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
label = %time%  %date%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-muted = MUTE
label-muted-foreground = #888888

[module/bluetooth]
type = custom/script
exec = bluetoothctl show 2>/dev/null | grep -q 'Powered: yes' && echo '  on' || echo '  off'
interval = 5
click-left = kitty -e bluetuith

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging =  <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full =  <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Full
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

[module/powermenu]
type = custom/text
content = ⏻
content-foreground = ${colors.alert}
click-left = wlogout -b 4
